  <script>
    // Shopify-iframes trenger full høyde for at flex-layouten
    // (bilde over, pris nederst) skal fylle den kvadratiske boksen.
    (function () {
      var css = "html,body{height:100%;margin:0}";
      function styleFrame(frame) {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.head || doc.getElementById("box-fill")) return;
          var style = doc.createElement("style");
          style.id = "box-fill";
          style.textContent = css;
          doc.head.appendChild(style);
        } catch (e) {}
      }
      function scan() {
        document.querySelectorAll(".product-link-wrap iframe").forEach(styleFrame);
      }
      scan();
      new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
      setInterval(scan, 500);
    })();
  </script>
